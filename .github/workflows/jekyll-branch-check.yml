name: Jekyll Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify generated public pages
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/sitemap.xml
          test -f _site/blog/index.html
          test -f _site/blog/gioi-thieu-motoopen/index.html
          test -f _site/blog/checklist-10-phut-truoc-khi-nhan-xe/index.html
          test -f _site/blog/xe-ga-hay-xe-so/index.html
          grep -q "Checklist 10 phút trước khi nhận xe máy ở Hà Nội" _site/blog/checklist-10-phut-truoc-khi-nhan-xe/index.html
          grep -q "Xe ga hay xe số: chọn loại nào khi đi Hà Nội?" _site/blog/xe-ga-hay-xe-so/index.html
          grep -q "classList.add('in')" _site/assets/js/site.js
          grep -q ".reveal.in" _site/assets/css/home.css
          if grep -q 'class="hero-mini reveal"' _site/blog/checklist-10-phut-truoc-khi-nhan-xe/index.html; then
            echo "Blog post hero must not depend on reveal animation for visibility."
            exit 1
          fi
          for page in gioithieu dichvu banggia thutuc loaixe huongdan kinhnghiem faq lienhe mangxahoi chinhsachbaomat dieukhoansudung; do
            test -f "_site/$page.html"
          done
          grep -q "/chothuexemayhanoi/blog/" _site/sitemap.xml
          grep -q "/chothuexemayhanoi/blog/gioi-thieu-motoopen/" _site/sitemap.xml
          test ! -e _site/_archive
          test ! -e _site/_seo
          if grep -R -n -E '\{%|\{\{' _site --include='*.html'; then
            echo "Unrendered Liquid found in generated HTML."
            exit 1
          fi
          echo "Jekyll build, sitemap, 404 and generated-page checks passed."
