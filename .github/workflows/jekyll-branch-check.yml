name: Jekyll Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '_factory/incoming/**'
      - '_factory/last-run.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Article factory smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/article_factory.py
          python3 scripts/article_factory.py status
          python3 scripts/article_factory.py next --limit 1 > /tmp/factory-next.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/factory-next.json'))
          assert data['ok'] is True
          assert data['count'] in (0, 1)
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = " ".join(["hướng dẫn thuê xe máy hà nội thực tế an toàn thuận tiện"] * 90)
          draft = """---
matrix_id: 1
description: "Hướng dẫn thử nghiệm cho factory smoke, dùng để kiểm tra parser và QA scoped trước khi publish."
---
## Chuẩn bị
%s

[Xem thủ tục]({{ '/thutuc.html' | relative_url }})

## Kiểm tra
%s
""" % (text, text)
          p = Path('_factory/incoming/001.md')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(draft, encoding='utf-8')
          PY
          python3 scripts/article_factory.py check _factory/incoming/001.md
          rm -f _factory/incoming/001.md

      - name: Verify SEO article matrix
        shell: bash
        run: |
          set -euo pipefail
          test -f _seo/article-matrix-300.json
          jq -e '.role == "canonical_article_matrix"' _seo/article-matrix-300.json >/dev/null
          jq -e '.article_count == 300 and (.items | length == 300)' _seo/article-matrix-300.json >/dev/null
          test "$(jq -r '.items[].primary_keyword' _seo/article-matrix-300.json | sort | uniq -d | wc -l)" -eq 0
          test "$(jq -r '.items[].slug' _seo/article-matrix-300.json | sort | uniq -d | wc -l)" -eq 0
          test "$(jq '[.items[] | select(.status == "published")] | length' _seo/article-matrix-300.json)" -eq 2
          test "$(jq '[.items[] | select((.taxonomy.parent_slug // "") == "" or (.taxonomy.child_slug // "") == "" or (.taxonomy.child_url // "") == "")] | length' _seo/article-matrix-300.json)" -eq 0
          test "$(jq -r '.items[].taxonomy.child_slug' _seo/article-matrix-300.json | sort -u | wc -l)" -eq 10

      - name: Verify generated public pages
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          for image in IMG_5418.jpeg IMG_5419.jpeg IMG_5420.jpeg IMG_5421.jpeg IMG_5426.jpeg IMG_5431.jpeg; do
            test -f "_site/assets/images/vehicles/$image"
            grep -q "/chothuexemayhanoi/assets/images/vehicles/$image" _site/index.html
          done
          if grep -q "raw.githubusercontent.com/motoopen/chothuexemayhanoi/refs/heads/main/IMG_54" _site/index.html; then
            echo "Homepage still references branch-raw vehicle images."
            exit 1
          fi
          test -f _site/404.html
          test -f _site/sitemap.xml
          test -f _site/blog/index.html
          test -f _site/blog/danh-muc/index.html
          for category in \
            thue-xe/index.html thue-xe/bat-dau-thue/index.html thue-xe/gia-thoi-gian/index.html \
            loai-xe/index.html loai-xe/xe-50cc/index.html loai-xe/xe-dien/index.html loai-xe/cac-loai-xe/index.html \
            khu-vuc/index.html khu-vuc/ha-noi-theo-khu-vuc/index.html \
            huong-dan/index.html huong-dan/thu-tuc-phap-ly/index.html huong-dan/an-toan-su-co/index.html \
            kinh-nghiem/index.html kinh-nghiem/hanh-trinh/index.html kinh-nghiem/so-sanh-lua-chon/index.html; do
            test -f "_site/blog/danh-muc/$category"
          done
          test -f _site/blog/gioi-thieu-motoopen/index.html
          test -f _site/blog/checklist-10-phut-truoc-khi-nhan-xe/index.html
          test -f _site/blog/xe-ga-hay-xe-so/index.html
          grep -q "Checklist 10 phút trước khi nhận xe máy ở Hà Nội" _site/blog/checklist-10-phut-truoc-khi-nhan-xe/index.html
          grep -q "Xe ga hay xe số: chọn loại nào khi đi Hà Nội?" _site/blog/xe-ga-hay-xe-so/index.html
          grep -q "classList.add('in')" _site/assets/js/site.js
          grep -q ".reveal.in" _site/assets/css/home.css
          grep -q "motoopen-v3" _site/service-worker.js
          grep -q "cache: 'no-store'" _site/service-worker.js
          grep -q '"start_url": "/chothuexemayhanoi/"' _site/manifest.json
          if grep -q 'class="hero-mini reveal"' _site/blog/checklist-10-phut-truoc-khi-nhan-xe/index.html; then
            echo "Blog post hero must not depend on reveal animation for visibility."
            exit 1
          fi
          for page in gioithieu dichvu banggia thutuc loaixe huongdan kinhnghiem faq lienhe mangxahoi chinhsachbaomat dieukhoansudung; do
            test -f "_site/$page.html"
          done
          grep -q "/chothuexemayhanoi/blog/" _site/sitemap.xml
          grep -q "/chothuexemayhanoi/blog/gioi-thieu-motoopen/" _site/sitemap.xml
          grep -q "/chothuexemayhanoi/blog/danh-muc/loai-xe/xe-50cc/" _site/sitemap.xml
          grep -q "/chothuexemayhanoi/blog/danh-muc/loai-xe/xe-dien/" _site/sitemap.xml
          grep -q "Danh mục Blog" _site/blog/danh-muc/index.html
          grep -q "Xe ga hay xe số" _site/blog/danh-muc/kinh-nghiem/so-sanh-lua-chon/index.html
          grep -q "Checklist 10 phút" _site/blog/danh-muc/huong-dan/an-toan-su-co/index.html
          test ! -e _site/_archive
          test ! -e _site/_seo
          test ! -e _site/_factory
          if grep -R -n -E '\{%|\{\{' _site --include='*.html'; then
            echo "Unrendered Liquid found in generated HTML."
            exit 1
          fi
          echo "Jekyll build, sitemap, 404 and generated-page checks passed."
