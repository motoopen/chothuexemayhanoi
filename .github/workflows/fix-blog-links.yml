name: Fix Blog Internal Links

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-blog-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-blog-internal-links
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair root links that point to blog posts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          posts = sorted(Path("_posts").glob("*.md"))
          slug_re = re.compile(r"^\d{4}-\d{2}-\d{2}-(.+)\.md$")
          slugs = {
              m.group(1)
              for p in posts
              if (m := slug_re.match(p.name))
          }

          liquid_re = re.compile(
              r"(\{\{\s*['\"])(/[^'\"]+)(['\"]\s*\|\s*relative_url\s*\}\})"
          )
          markdown_re = re.compile(r"(\]\(\s*)(/[^)\s]+)(\s*\))")
          href_re = re.compile(r"(\bhref\s*=\s*['\"])(/[^'\"]+)(['\"])")

          def split_suffix(url):
              match = re.match(r"^([^?#]*)(.*)$", url)
              return match.group(1), match.group(2)

          def repair_url(url):
              path, suffix = split_suffix(url)
              prefix = ""
              rel = path

              if path.startswith("/chothuexemayhanoi/"):
                  prefix = "/chothuexemayhanoi"
                  rel = path[len(prefix):]
              elif path.startswith("/"):
                  prefix = ""
                  rel = path
              else:
                  return url

              normalized = rel.strip("/")
              if normalized.startswith("blog/"):
                  return url
              if normalized not in slugs:
                  return url

              return f"{prefix}/blog/{normalized}/{suffix}"

          total = 0
          changed_files = 0

          for path in posts:
              original = path.read_text(encoding="utf-8")
              text = original

              def liquid_sub(m):
                  nonlocal_marker = None
                  old = m.group(2)
                  new = repair_url(old)
                  return m.group(1) + new + m.group(3)

              text, n1 = liquid_re.subn(liquid_sub, text)

              def markdown_sub(m):
                  old = m.group(2)
                  new = repair_url(old)
                  return m.group(1) + new + m.group(3)

              text, n2 = markdown_re.subn(markdown_sub, text)

              def href_sub(m):
                  old = m.group(2)
                  new = repair_url(old)
                  return m.group(1) + new + m.group(3)

              text, n3 = href_re.subn(href_sub, text)

              # Count only replacements that actually changed bytes.
              if text != original:
                  # Re-count changed URLs by comparing the relevant bad-link forms.
                  before_bad = 0
                  after_bad = 0
                  for match in liquid_re.finditer(original):
                      if repair_url(match.group(2)) != match.group(2):
                          before_bad += 1
                  for match in markdown_re.finditer(original):
                      if repair_url(match.group(2)) != match.group(2):
                          before_bad += 1
                  for match in href_re.finditer(original):
                      if repair_url(match.group(2)) != match.group(2):
                          before_bad += 1
                  for match in liquid_re.finditer(text):
                      if repair_url(match.group(2)) != match.group(2):
                          after_bad += 1
                  for match in markdown_re.finditer(text):
                      if repair_url(match.group(2)) != match.group(2):
                          after_bad += 1
                  for match in href_re.finditer(text):
                      if repair_url(match.group(2)) != match.group(2):
                          after_bad += 1
                  total += max(0, before_bad - after_bad)
                  changed_files += 1
                  path.write_text(text, encoding="utf-8")

          remaining = []
          for path in posts:
              text = path.read_text(encoding="utf-8")
              for regex in (liquid_re, markdown_re, href_re):
                  for match in regex.finditer(text):
                      if repair_url(match.group(2)) != match.group(2):
                          remaining.append((str(path), match.group(2)))

          print(f"Changed files: {changed_files}")
          print(f"Repaired root-to-blog links: {total}")
          print(f"Remaining known bad root links: {len(remaining)}")
          if remaining:
              for item in remaining[:20]:
                  print("REMAINING", item[0], "->", item[1])
              raise SystemExit(1)
          PY

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile scripts/article_factory.py
          python3 scripts/article_factory.py status

      - name: Commit repaired links
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- _posts; then
            echo "No blog links needed repair."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Fix internal blog post links"
          git push origin HEAD:main
