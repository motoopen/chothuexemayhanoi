# SEO Hub / Silo architecture (single source of truth).
# Homepage -> Pillar (money page) -> SEO Hub -> Silo (category) -> Supporting posts.
# Each post declares `seo_hub: <key>` in front matter. Templates read this file to
# render the hub box, so editing a hub here updates every post that belongs to it.
# Hub/pillar URLs are existing pages only: no new competing pages are created.
# The main target URL for the "thuê xe máy tháng Hà Nội" keyword group is the homepage.
monthly_pillar:
  url: "/"
  label: "Thuê xe máy tháng Hà Nội"
  anchors:
    - "Thuê xe máy tháng Hà Nội"
    - "Dịch vụ thuê xe máy theo tháng"
    - "Gói thuê xe tháng của Motoopen"
    - "Thuê xe máy dài hạn tại Hà Nội"

hubs:
  - key: thue-xe-thang
    label: "Thuê xe máy theo tháng"
    icon: "fa-solid fa-calendar-days"
    pillar_url: "/"
    pillar_label: "Thuê xe máy tháng Hà Nội"
    silo_url: "/blog/danh-muc/thue-xe/gia-thoi-gian/"
    silo_label: "Giá & thời gian thuê"
    summary: "Gói thuê tháng, so sánh với thuê ngày/tuần, điều khoản và cách chọn xe cho cả tháng."
  - key: gia-coc
    label: "Giá thuê xe & tiền đặt cọc"
    icon: "fa-solid fa-tags"
    pillar_url: "/banggia.html"
    pillar_label: "Bảng giá thuê xe máy Hà Nội"
    silo_url: "/blog/danh-muc/thue-xe/gia-thoi-gian/"
    silo_label: "Giá & thời gian thuê"
    summary: "Cách đọc bảng giá, các khoản phí, tiền cọc và điều kiện hoàn cọc."
  - key: di-lam-dai-han
    label: "Thuê xe đi làm, công tác & ở dài hạn"
    icon: "fa-solid fa-briefcase"
    pillar_url: "/"
    pillar_label: "Thuê xe máy tháng Hà Nội"
    silo_url: "/blog/danh-muc/thue-xe/bat-dau-thue/"
    silo_label: "Bắt đầu thuê"
    summary: "Thuê xe máy đi làm, đi công tác, người nước ngoài và người mới chuyển đến Hà Nội cần xe ổn định nhiều tuần, nhiều tháng."
  - key: sinh-vien
    label: "Thuê xe cho sinh viên"
    icon: "fa-solid fa-graduation-cap"
    pillar_url: "/"
    pillar_label: "Thuê xe máy tháng Hà Nội"
    silo_url: "/blog/danh-muc/thue-xe/bat-dau-thue/"
    silo_label: "Bắt đầu thuê"
    summary: "Sinh viên thuê xe theo tháng: chọn xe tiết kiệm, giấy tờ, ngân sách và lưu ý an toàn."
  - key: xe-so
