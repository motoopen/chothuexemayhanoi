title: "Motoopen"
description: "Motoopen — Thuê xe máy Hà Nội: giao tận nơi, cọc nhẹ, xe bảo dưỡng định kỳ."
url: "https://motoopen.github.io"
baseurl: "/chothuexemayhanoi"
lang: "vi"
author: "Motoopen"
timezone: "Asia/Ho_Chi_Minh"

fa_css: "/assets/vendor/fontawesome/icons.css"  # self-hosted subset (scripts/build_icon_subset.py)
logo: "https://i.postimg.cc/PrKmHvJX/IMG-5272.jpg"
social_image: "https://i.postimg.cc/brsmsj5N/IMG-5215.jpg"

exclude:
  - docs
  - _factory
  - _seo
  - _archive
  # Internal tooling/reports: kept in the repo, not published on GitHub Pages
  - README.md
  - scripts
  - seo-optimization-matrix.json
  - seo-optimization-matrix.md
  - qa
  - AGENTS.md
  - MASTER-SEO-MATRIX.csv
  - KEYWORD-MATRIX.csv
  - INTERNAL-LINK-MAP.csv
  - SEO-HUB-ARCHITECTURE.md
  - AEO-GEO-AUDIT.md
  - TECHNICAL-SEO-AUDIT.md
  - QA-REPORT.md
  - CHECKPOINT.md
  # Third-party chatbot dataset (another brand's NAP/policy): OWNER_REVIEW before re-publishing
  - du-lieu/huongdanthue.txt

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Motoopen"
      permalink: /blog/:title/
